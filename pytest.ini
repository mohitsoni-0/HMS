[pytest]
DJANGO_SETTINGS_MODULE = hotel_booking_service.test_settings
python_files = test_*.py
pythonpath = . libs/hotel-commons
addopts = -q --strict-markers --import-mode=importlib
markers =
    integration: needs docker postgres+redis
    db: touches the database
testpaths =
    libs/hotel-commons/tests
    hotel_booking_service
    catalog
    inventory
    pricing
    discovery
    booking
    payment
    tests
